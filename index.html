<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HY·PE·PER · FOGth · Time Engine</title>

<style>
  body {
    background: #000;
    margin: 0;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #fogth {
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #info {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #0f0;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    padding: 8px 20px;
    border-radius: 30px;
    border: 1px solid #0f0;
    text-align: center;
    white-space: nowrap;
    letter-spacing: 2px;
    box-shadow: 0 0 20px rgba(0,255,0,0.1);
  }
</style>
</head>

<body>

<canvas id="fogth"></canvas>

<div id="info">⚡ HY·PE·PER · FOGth · 3×3 · TIME ENGINE · ID = W</div>

<script>
const canvas = document.getElementById('fogth');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ─────────────────────────────────────────────
// HY·PE·PER ENGINE – läuft IMMER
// ─────────────────────────────────────────────

let time = 0;
let speed = 0.03;

// 3×3 Orbit Nodes
const nodes = [
  { name: "A", color: "#ffaa00" },
  { name: "B", color: "#00ccff" },
  { name: "C", color: "#ff00aa" }
];

// MC FLY Flux
let flux = 1.0;

// ESPRESSO Kick (eingebaut)
function espressoKick(t) {
  const flow = Math.sin(t * 0.5) * 0.5 + 0.5;
  const energy = Math.cos(t * 0.3) * 0.5 + 0.5;
  return (flow + energy) * 0.8;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  // ESPRESSO Kick
  flux = espressoKick(time);

  // Tornado Spirale
  ctx.beginPath();
  ctx.strokeStyle = "#0f0";
  ctx.lineWidth = 1;

  for (let t = 0; t < 200; t++) {
    const tx = cx + Math.cos(time + t * 0.1) * (t * flux * 1.5);
    const ty = cy + Math.sin(time + t * 0.1) * (t * flux * 1.5);
    ctx.lineTo(tx, ty);
  }
  ctx.stroke();

  // 3×3 Orbit Nodes
  const radius = 150 * flux;

  nodes.forEach((node, i) => {
    const x = cx + Math.cos(time + i * 2) * radius;
    const y = cy + Math.sin(time + i * 2) * radius;

    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.strokeStyle = node.color;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = node.color;
    ctx.fillText(node.name, x - 5, y + 5);
  });

  time += speed;
  requestAnimationFrame(draw);
}

draw();

// Resize
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
