<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HY·PE·PER · FOGth · 3×3 · Time Engine</title>

<style>
  body {
    background: #000;
    margin: 0;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #fogth {
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #info {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #0f0;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    padding: 8px 20px;
    border-radius: 30px;
    border: 1px solid #0f0;
    text-align: center;
    white-space: nowrap;
    letter-spacing: 2px;
    box-shadow: 0 0 20px rgba(0,255,0,0.1);
  }
  #info .mc { color: #ffaa00; font-weight: bold; }
  #info .fly { color: #00ccff; font-weight: bold; }
</style>
</head>

<body>

<canvas id="fogth"></canvas>

<div id="info">
  <span class="mc">⚡ HY·PE·PER</span> ·
  <span class="fly">FOGth</span> ·
  3×3 · TIME ENGINE · ID = W · <span style="color:#ffaa00;">✦ FLUX</span>
</div>

<script>
const canvas = document.getElementById('fogth');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ─────────────────────────────────────────────
// HY·PE·PER ENGINE – erweitert
// ─────────────────────────────────────────────

let time = 0;
let speed = 0.03;

// ─── 3×3 Matrix ─────────────────────────────
const matrix = [
  [{ name: 'A' }, { name: 'B' }, { name: 'C' }],
  [{ name: 'B' }, { name: 'C' }, { name: 'A' }],
  [{ name: 'C' }, { name: 'A' }, { name: 'B' }]
];

// ─── ESPRESSO Kick ──────────────────────────
function espressoKick(t) {
  const flow = Math.sin(t * 0.5) * 0.5 + 0.5;
  const energy = Math.cos(t * 0.3) * 0.5 + 0.5;
  return (flow + energy) * 0.8;
}

// ─── DRAW ────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  const flux = espressoKick(time);
  const radius = 140 + Math.sin(time * 0.3) * 20;

  // ── 1. Verbindungen ──
  for (let i = 0; i < matrix.length; i++) {
    for (let j = 0; j < matrix[i].length; j++) {
      for (let k = 0; k < matrix.length; k++) {
        if (k === j) continue;
        const x1 = cx + Math.cos(time + (i + j)) * radius * (i + 1);
        const y1 = cy + Math.sin(time + (i + j)) * radius * (j + 1);
        const x2 = cx + Math.cos(time + (i + k)) * radius * (i + 1);
        const y2 = cy + Math.sin(time + (i + k)) * radius * (k + 1);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = `rgba(0, 255, 0, ${0.04 + flux * 0.06})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  // ── 2. 9 Zellen ──
  for (let i = 0; i < matrix.length; i++) {
    for (let j = 0; j < matrix[i].length; j++) {
      const cell = matrix[i][j];
      const cellFlux = 0.5 + 0.5 * Math.sin(time * 0.5 + i * 1.3 + j * 0.7);
      const size = 18 + cellFlux * 12;
      const glow = 0.1 + cellFlux * 0.9;

      const x = cx + Math.cos(time + (i + j)) * radius * (i + 1);
      const y = cy + Math.sin(time + (i + j)) * radius * (j + 1);

      // Glow
      const grad = ctx.createRadialGradient(x, y, 0, x, y, size + 10);
      grad.addColorStop(0, `rgba(0, 255, 0, ${0.1 + cellFlux * 0.2})`);
      grad.addColorStop(1, 'rgba(0, 255, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, size + 10, 0, Math.PI * 2);
      ctx.fill();

      // Kreis
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      const colors = ['#ffaa00', '#00ccff', '#ff00aa'];
      ctx.strokeStyle = colors[(i + j) % 3];
      ctx.lineWidth = 1.5 + cellFlux * 1.5;
      ctx.shadowColor = '#0f0';
      ctx.shadowBlur = 10 + cellFlux * 10;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Label
      ctx.fillStyle = `rgb(200, 255, ${150 + cellFlux * 100})`;
      ctx.font = `${14 + cellFlux * 6}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(cell.name, x, y + 2);
    }
  }

  // ── 3. Tornado-Spirale ──
  ctx.beginPath();
  ctx.strokeStyle = `rgba(0, 255, 200, ${0.1 + flux * 0.1})`;
  ctx.lineWidth = 1;
  for (let t = 0; t < 200; t++) {
    const tx = cx + Math.cos(time + t * 0.08) * (t * 1.2 + Math.sin(t * 0.05 + time * 2) * 30);
    const ty = cy + Math.sin(time + t * 0.08) * (t * 1.2 + Math.sin(t * 0.05 + time * 2) * 30);
    ctx.lineTo(tx, ty);
  }
  ctx.stroke();

  // ── 4. Zeit-Pulse ──
  for (let p = 0; p < 5; p++) {
    const phase = (p / 5) * Math.PI * 2 + time * 0.5;
    const r = 50 + Math.sin(phase) * 30;
    const px = cx + Math.cos(phase) * r;
    const py = cy + Math.sin(phase) * r;
    ctx.beginPath();
    ctx.arc(px, py, 3 + Math.sin(phase + time) * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 255, 200, ${0.3 + Math.sin(phase) * 0.2})`;
    ctx.fill();
  }

  time += speed;
  requestAnimationFrame(draw);
}

draw();

// Resize
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
